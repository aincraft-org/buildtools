name: Masonry
version: ${version}
main: dev.mintychochip.masonry.paper.MasonryPlugin
api-version: "26.2"
authors:
  - mintychochip
softdepend:
  - FastAsyncWorldEdit
  - WorldEdit
  - WorldGuard
commands:
  masonry:
    description: Masonry command root
    usage: /masonry <pos1|pos2|replace|fill|survival_fill|copy|paste|cut|move|repeat|undo|redo|blueprint|wand|previewmode>
    permission: masonry.command
permissions:
  masonry.command:
    description: Use the /masonry command root
    default: true
  masonry.tool.survival_fill:
    description: Use /masonry survival_fill and the gadget's safe fill
    default: true
  masonry.tool.copy:
    description: Use /masonry copy
    default: true
  masonry.tool.fill:
    description: Use /masonry fill (overwrites any block)
    default: op
  masonry.tool.replace:
    description: Use /masonry replace (replaces matched blocks)
    default: op
  masonry.tool.cut:
    description: Use /masonry cut (copy and clear the selection)
    default: op
  masonry.tool.move:
    description: Use /masonry move (cut and paste elsewhere)
    default: op
  masonry.tool.paste:
    description: Use /masonry paste
    default: op
  masonry.bypass.creative:
    description: Skip survival inventory cost
    default: op
  masonry.bypass.survival:
    description: Skip survival inventory cost
    default: op
